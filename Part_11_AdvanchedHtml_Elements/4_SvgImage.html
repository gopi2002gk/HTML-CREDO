<html>
<head>
    <title>SVG Shapes Example</title>
    <meta charset="UTF-8">
</head>

<body>

    <!-- Rectangle -->
    <h3>Rectangle</h3>
    <svg width="120" height="100">
        <rect width="120" height="80" fill="orange" />
    </svg>

    <!-- Rounded Rectangle -->
    <h3>Rounded Rectangle</h3>
    <svg width="120" height="100">
        <rect width="120" height="80" rx="20" ry="20" fill="green" />
    </svg>

    <!-- Line -->
    <h3>Line</h3>
    <svg width="200" height="100">
        <line x1="0" y1="50" x2="200" y2="50" stroke="blue" stroke-width="5" />
    </svg>

    <!-- Triangle (Polygon) -->
    <h3>Triangle</h3>
    <svg width="120" height="100">
        <polygon points="60,10 110,90 10,90" fill="purple" />
    </svg>

</body>
</html>
