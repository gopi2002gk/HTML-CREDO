<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accessibility Example</title>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="description" content="Gopi profile accessibility example">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    
    <!-- Paragraph Content -->
    <p 
        id="tejesh"
        class="tejesh-content"
        aria-label="Tejesh full stack developer information"
    >
        Tejesh is a Full Stack Developer student from Chennai, born on 2003. 
        He is learning HTML, CSS, and JavaScript to build modern websites.
    </p>

    <!-- Image -->
    <img 
        src="/Assets ALL/tejesh.jpeg" 
        alt="Tejesh learning coding on laptop"
        width="150"
    >

</body>
</html>
