<html>
<head>
    <title>Mouse Event</title>
</head>

<body>

    <h1>Mouse Events</h1>

    <p 
        onmouseover="this.innerHTML='Welcome Gopi (Mouse Enter)'"
        onmouseout="this.innerHTML=' Hello Gopi'"
        style="background-color: blue;width: 250px;color: black ;"
        
        
        
    >
         Hello Gopi
    </p>

</body>
</html>
